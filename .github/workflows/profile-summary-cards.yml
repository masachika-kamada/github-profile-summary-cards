name: GitHub-Profile-Summary-Cards

on:
  schedule: # 1 日 1 回 (00:00 UTC = 09:00 JST)
    - cron: "0 0 * * *"
  workflow_dispatch:

# push に使うのはこのワークフロー専用の一時トークン (このリポジトリだけ書き込み可)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 外部 Action が git 設定から書き込み用トークンを読めないようにする
          persist-credentials: false

      # 外部 Action はコミットで固定し、渡すのは読み取り専用トークンだけ
      - uses: vn7n24fzkq/github-profile-summary-cards@58ec032e39377dd38329bdc1db70074fe74fbb17 # release (2026-10-19)
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false

      - name: Commit and push cards
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Generate profile summary cards"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
